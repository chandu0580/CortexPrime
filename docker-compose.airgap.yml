# ==============================================================
# CORTEXPRIME — Docker Compose (Air-Gapped)
# ==============================================================
# For environments with no internet access.
# All images must be pre-loaded from an air-gap bundle.
# Uses local Ollama for LLM inference.
# ==============================================================

name: cortexprime-airgap

networks:
  cortex-app:
    name: cortex-airgap-app
    driver: bridge
  cortex-data:
    name: cortex-airgap-data
    driver: bridge

volumes:
  cortex-postgres-data:
  cortex-redis-data:
  cortex-rabbitmq-data:
  cortex-neo4j-data:
  cortex-chroma-data:
  cortex-minio-data:
  cortex-ollama-models:

services:

  cortex-backend:
    container_name: cortex-airgap-backend
    image: cortexprime-backend:airgap
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: air-gapped
      LOG_LEVEL: warning
      AUTH_DISABLED: "false"
      RATE_LIMIT_ENABLED: "true"
      WS_AUTH_REQUIRED: "true"
      BLOCK_ON_MIGRATION_FAILURE: "true"
      STRICT_EMBEDDING_VALIDATION: "true"
      MODEL_ORCHESTRATOR: ollama/llama3.2
      MODEL_PLANNER: ollama/llama3.2
      MODEL_CRITIC: ollama/llama3.2
      MODEL_RUNTIME_FAST: ollama/llama3.2
      EMBEDDING_PROVIDER: local
      VECTOR_DB_PROVIDER: chroma
      ENABLE_LIVE_RESEARCH: "false"
      ENABLE_WEB_SEARCH: "false"
      OLLAMA_BASE_URL: http://cortex-ollama:11434
      POSTGRES_HOST: cortex-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cortexdb
      REDIS_HOST: cortex-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: cortex-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: cortex
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: cortex
      NEO4J_URI: bolt://cortex-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: https://app.cortexprime.internal
    volumes:
      - cortex-chroma-data:/data/chroma
    depends_on:
      cortex-postgres:
        condition: service_healthy
      cortex-redis:
        condition: service_healthy
      cortex-rabbitmq:
        condition: service_healthy
      cortex-neo4j:
        condition: service_healthy
      cortex-ollama:
        condition: service_healthy
    networks:
      - cortex-app
      - cortex-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  cortex-frontend:
    container_name: cortex-airgap-frontend
    image: cortexprime-frontend:airgap
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://app.cortexprime.internal/api
      NEXT_PUBLIC_WS_URL: wss://app.cortexprime.internal/ws
    depends_on:
      cortex-backend:
        condition: service_healthy
    networks:
      - cortex-app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  cortex-worker:
    container_name: cortex-airgap-worker
    image: cortexprime-worker:airgap
    restart: unless-stopped
    environment:
      ENV: air-gapped
      CELERY_BROKER_URL: amqp://cortex:${RABBITMQ_PASSWORD}@cortex-rabbitmq:5672/cortex
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@cortex-redis:6379/0
      OLLAMA_BASE_URL: http://cortex-ollama:11434
      LOG_LEVEL: warning
    depends_on:
      cortex-rabbitmq:
        condition: service_healthy
      cortex-redis:
        condition: service_healthy
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.tasks status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cortex-postgres:
    container_name: cortex-airgap-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cortexdb
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - cortex-postgres-data:/var/lib/postgresql/data
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortexdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cortex-redis:
    container_name: cortex-airgap-redis
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - cortex-redis-data:/data
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cortex-rabbitmq:
    container_name: cortex-airgap-rabbitmq
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cortex
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: cortex
    volumes:
      - cortex-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  cortex-neo4j:
    container_name: cortex-airgap-neo4j
    image: neo4j:5.18-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
    volumes:
      - cortex-neo4j-data:/data
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  cortex-ollama:
    container_name: cortex-airgap-ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - cortex-ollama-models:/root/.ollama
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  cortex-minio:
    container_name: cortex-airgap-minio
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: cortex
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - cortex-minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
