# ==============================================================
# CORTEXPRIME — Air-Gapped Production Stack
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.airgap.yml up -d
#
# Prerequisites:
#   1. All images pre-loaded (see ADMINISTRATOR_GUIDE.md §3.5)
#   2. Ollama running locally with llama3.2 model pulled
#   3. TLS certs in ./infra/nginx/certs/{cert.pem,key.pem}
#   4. All passwords set in .env
# ==============================================================

name: cortexprime

# ==============================================================
# NETWORKS — Isolated service planes
# ==============================================================

networks:
  cortex-app:
    name: cortex-app
    driver: bridge
  cortex-data:
    name: cortex-data
    driver: bridge

# ==============================================================
# VOLUMES
# ==============================================================

volumes:
  cortex-nginx-certs:
    name: cortex-nginx-certs
  cortex-ollama-data:
    name: cortex-ollama-data

# ==============================================================
# SERVICES
# ==============================================================

services:

  # ------------------------------------------------------------
  # NGINX — TLS termination + reverse proxy
  # ------------------------------------------------------------
  cortex-nginx:
    container_name: cortex-nginx
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      cortex-backend:
        condition: service_healthy
      cortex-frontend:
        condition: service_healthy
    networks:
      - cortex-app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  # ------------------------------------------------------------
  # OLLAMA — Local LLM inference (air-gapped)
  # ------------------------------------------------------------
  cortex-ollama:
    container_name: cortex-ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - cortex-ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G

  # ------------------------------------------------------------
  # BACKEND — Air-gapped config
  # ------------------------------------------------------------
  cortex-backend:
    build:
      target: production
    restart: always
    ports: !reset []
    environment:
      ENVIRONMENT: air-gapped
      LOG_LEVEL: warning
      CORS_ORIGINS: https://app.cortexprime.internal
      # Air-gapped LLM — all local via Ollama
      MODEL_ORCHESTRATOR: ollama/llama3.2
      MODEL_PLANNER: ollama/llama3.2
      MODEL_CRITIC: ollama/llama3.2
      MODEL_RUNTIME_FAST: ollama/llama3.2
      EMBEDDING_PROVIDER: local
      VECTOR_DB_PROVIDER: chroma
      CHROMA_PATH: /data/chroma
      OLLAMA_BASE_URL: http://cortex-ollama:11434
      # Disable external services
      ENABLE_LIVE_RESEARCH: "false"
      ENABLE_WEB_SEARCH: "false"
      TAVILY_API_KEY: ""
      SENTRY_DSN: ""
      # Voice — local only
      ENABLE_TTS: "true"
      ENABLE_STT: "true"
      ENABLE_REALTIME_RUNTIME: "false"
      LIVEKIT_URL: ""
      # Auth
      AUTH_DISABLED: "false"
      RATE_LIMIT_ENABLED: "true"
      WS_AUTH_REQUIRED: "true"
      REVOCATION_FAIL_OPEN: "false"
      STRUCTURED_LOGGING: "true"
      BLOCK_ON_MIGRATION_FAILURE: "true"
    volumes: !reset
      - cortex-chroma-data:/data/chroma
    command: >
      uvicorn backend.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --log-level warning
    depends_on:
      cortex-postgres:
        condition: service_healthy
      cortex-redis:
        condition: service_healthy
      cortex-rabbitmq:
        condition: service_healthy
      cortex-neo4j:
        condition: service_healthy
      cortex-ollama:
        condition: service_healthy
    networks:
      - cortex-app
      - cortex-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ------------------------------------------------------------
  # FRONTEND — Production standalone
  # ------------------------------------------------------------
  cortex-frontend:
    build:
      target: production
    restart: always
    ports: !reset []
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://app.cortexprime.internal
      NEXT_PUBLIC_WS_URL: wss://app.cortexprime.internal/ws
    volumes: !reset []
    command: node server.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cortex-app
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ------------------------------------------------------------
  # POSTGRES — Internal only
  # ------------------------------------------------------------
  cortex-postgres:
    restart: always
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ------------------------------------------------------------
  # REDIS — Internal only
  # ------------------------------------------------------------
  cortex-redis:
    restart: always
    ports: !reset []
    command: >
      redis-server /usr/local/etc/redis/redis.conf
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
        --bind 0.0.0.0
        --protected-mode yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ------------------------------------------------------------
  # RABBITMQ — Internal only
  # ------------------------------------------------------------
  cortex-rabbitmq:
    restart: always
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ------------------------------------------------------------
  # NEO4J — Internal only
  # ------------------------------------------------------------
  cortex-neo4j:
    restart: always
    ports: !reset []
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
