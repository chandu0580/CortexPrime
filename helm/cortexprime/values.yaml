# ==============================================================
# CortexPrime — Helm Values (Default / Development)
# ==============================================================

# -- Global settings applied across all components
global:
  environment: development
  domain: cortexprime.local
  imageRegistry: ghcr.io/cortexprime
  imagePullSecrets: []

# -- Number of replicas for stateless services
replicaCount: 1

# -- Image configuration
image:
  repository: ghcr.io/cortexprime
  pullPolicy: IfNotPresent
  tag: latest

# -- Service account configuration
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Backend service configuration
backend:
  enabled: true
  image: backend
  port: 8000
  replicaCount: 1
  metricsPort: 8000
  probePath: /health
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  env:
    ENVIRONMENT: development
    LOG_LEVEL: info
    CORS_ORIGINS: http://localhost:3000
    POSTGRES_HOST: cortexprime-postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: cortex
    POSTGRES_DB: cortexdb
    REDIS_HOST: cortexprime-redis-master
    REDIS_PORT: "6379"
    RABBITMQ_HOST: cortexprime-rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_USER: cortex
    RABBITMQ_VHOST: cortex
    NEO4J_URI: bolt://cortexprime-neo4j:7687
    NEO4J_USER: neo4j
    JWT_ALGORITHM: HS256
    JWT_EXPIRE_MINUTES: "60"
    JWT_REFRESH_EXPIRE_H: "168"
    RATE_LIMIT_ENABLED: "true"
    WS_AUTH_REQUIRED: "true"
    AUTH_DISABLED: "false"
    BLOCK_ON_MIGRATION_FAILURE: "true"
    STRICT_EMBEDDING_VALIDATION: "true"
  secrets:
    POSTGRES_PASSWORD: ""
    REDIS_PASSWORD: ""
    RABBITMQ_PASSWORD: ""
    NEO4J_PASSWORD: ""
    JWT_SECRET_KEY: ""
    JWT_REFRESH_SECRET: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    AZURE_OPENAI_API_KEY: ""
    GOOGLE_API_KEY: ""
    TAVILY_API_KEY: ""
    SENTRY_DSN: ""
  # WARNING: All secrets above MUST be provided before deploying to production.
  # Empty values will cause startup failures unless overridden per-environment.

# -- Frontend service configuration
frontend:
  enabled: true
  image: frontend
  port: 3000
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: http://localhost:8000
    NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws

# -- Worker service configuration
worker:
  enabled: false
  image: worker
  port: 9100
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  env:
    ENVIRONMENT: development
    LOG_LEVEL: info
  secrets:
    POSTGRES_PASSWORD: ""
    REDIS_PASSWORD: ""
    RABBITMQ_PASSWORD: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""

# -- PostgreSQL configuration (uses bitnami/postgresql chart)
postgresql:
  enabled: true
  auth:
    database: cortexdb
    username: cortex
    password: ""
  primary:
    persistence:
      size: 10Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"

# -- Redis configuration (uses bitnami/redis chart)
redis:
  enabled: true
  auth:
    password: ""
  architecture: standalone
  master:
    persistence:
      size: 5Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"

# -- Neo4j configuration
neo4j:
  enabled: true
  password: ""
  persistence:
    size: 10Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# -- RabbitMQ configuration
rabbitmq:
  enabled: true
  auth:
    password: ""
    erlangCookie: ""
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# -- Ingress configuration
ingress:
  enabled: true
  className: nginx
  host: cortexprime.example.com
  tls:
    enabled: true
    secretName: cortexprime-tls
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/enable-cors: "true"

# -- Network policies
networkPolicies:
  enabled: true

# -- Service monitor for Prometheus Operator
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s

# -- Priority classes for critical workloads
priorityClass:
  create: false
  criticalValue: 9000

# -- Backup configuration (CronJob)
backup:
  enabled: false
  schedule: "0 3 * * *"
  storageSize: "50Gi"

# -- Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

# -- Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]
