# ==============================================================
# CortexPrime — Helm Values (Staging)
# ==============================================================

global:
  environment: staging
  domain: staging.cortexprime.ai

replicaCount: 2

image:
  pullPolicy: Always
  tag: staging

backend:
  replicaCount: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  env:
    ENVIRONMENT: staging
    LOG_LEVEL: info
    CORS_ORIGINS: https://staging.cortexprime.ai
    RATE_LIMIT_ENABLED: "true"
    WS_AUTH_REQUIRED: "true"
    AUTH_DISABLED: "false"
    BLOCK_ON_MIGRATION_FAILURE: "true"
    STRICT_EMBEDDING_VALIDATION: "true"
  secrets:
    POSTGRES_PASSWORD: ""
    REDIS_PASSWORD: ""
    RABBITMQ_PASSWORD: ""
    NEO4J_PASSWORD: ""
    JWT_SECRET_KEY: ""
    JWT_REFRESH_SECRET: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    AZURE_OPENAI_API_KEY: ""
    SENTRY_DSN: ""

frontend:
  replicaCount: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: https://staging.cortexprime.ai/api
    NEXT_PUBLIC_WS_URL: wss://staging.cortexprime.ai/ws

worker:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  env:
    ENVIRONMENT: staging
    LOG_LEVEL: info

ingress:
  host: staging.cortexprime.ai
  tls:
    secretName: cortexprime-staging-tls

priorityClass:
  create: true
  criticalValue: 9000

backup:
  enabled: true
  schedule: "0 4 * * *"
  storageSize: "50Gi"

networkPolicies:
  enabled: true

serviceMonitor:
  enabled: true
