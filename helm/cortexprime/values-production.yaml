# ==============================================================
# CortexPrime — Helm Values (Production)
# ==============================================================

global:
  environment: production
  domain: app.cortexprime.ai

replicaCount: 3

image:
  pullPolicy: Always
  tag: latest

backend:
  replicaCount: 3
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 2
  env:
    ENVIRONMENT: production
    LOG_LEVEL: warning
    CORS_ORIGINS: https://app.cortexprime.ai
    RATE_LIMIT_ENABLED: "true"
    WS_AUTH_REQUIRED: "true"
    AUTH_DISABLED: "false"
    BLOCK_ON_MIGRATION_FAILURE: "true"
    STRICT_EMBEDDING_VALIDATION: "true"
  secrets:
    POSTGRES_PASSWORD: ""
    REDIS_PASSWORD: ""
    RABBITMQ_PASSWORD: ""
    NEO4J_PASSWORD: ""
    JWT_SECRET_KEY: ""
    JWT_REFRESH_SECRET: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    AZURE_OPENAI_API_KEY: ""
    GOOGLE_API_KEY: ""
    TAVILY_API_KEY: ""
    SENTRY_DSN: ""

frontend:
  replicaCount: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 2
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: https://api.cortexprime.ai
    NEXT_PUBLIC_WS_URL: wss://api.cortexprime.ai/ws

worker:
  enabled: true
  replicaCount: 3
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  env:
    ENVIRONMENT: production
    LOG_LEVEL: warning
  secrets:
    POSTGRES_PASSWORD: ""
    REDIS_PASSWORD: ""
    RABBITMQ_PASSWORD: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""

ingress:
  host: app.cortexprime.ai
  tls:
    secretName: cortexprime-prod-tls
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod

postgresql:
  auth:
    password: ""
  primary:
    persistence:
      size: 100Gi
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

redis:
  auth:
    password: ""
  architecture: replication
  master:
    persistence:
      size: 20Gi
  replica:
    replicaCount: 2
    persistence:
      size: 20Gi

neo4j:
  password: ""
  persistence:
    size: 50Gi
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

rabbitmq:
  auth:
    password: ""
  persistence:
    size: 20Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

priorityClass:
  create: true
  criticalValue: 9000

backup:
  enabled: true
  schedule: "0 3 * * *"
  storageSize: "100Gi"

networkPolicies:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]
