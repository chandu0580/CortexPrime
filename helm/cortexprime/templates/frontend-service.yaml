apiVersion: v1
kind: Service
metadata:
  name: {{ include "cortexprime.fullname" . }}-frontend
  labels:
    {{- include "cortexprime.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "cortexprime.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
