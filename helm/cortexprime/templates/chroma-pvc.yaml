{{- if .Values.backend.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cortexprime.fullname" . }}-chroma-pvc
  labels:
    {{- include "cortexprime.labels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backend.chromaStorageSize | default "10Gi" }}
  storageClassName: {{ .Values.global.storageClass | default "" }}
{{- end }}
