{{- if .Values.priorityClass.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "cortexprime.fullname" . }}-critical
  labels:
    {{- include "cortexprime.labels" . | nindent 4 }}
value: {{ .Values.priorityClass.criticalValue | default 9000 }}
globalDefault: false
description: "Critical priority for CortexPrime core components (PostgreSQL, Redis, Backend)"
{{- end }}
