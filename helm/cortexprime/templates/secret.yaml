apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cortexprime.fullname" . }}-backend-secrets
  labels:
    {{- include "cortexprime.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $requiredMsg := "REQUIRED: set in values file or --set on install" }}
  POSTGRES_PASSWORD: {{ required $requiredMsg .Values.postgresql.auth.password | quote }}
  REDIS_PASSWORD: {{ required $requiredMsg .Values.redis.auth.password | quote }}
  RABBITMQ_PASSWORD: {{ required $requiredMsg .Values.rabbitmq.auth.password | quote }}
  NEO4J_PASSWORD: {{ required $requiredMsg .Values.neo4j.password | quote }}
  JWT_SECRET_KEY: {{ required $requiredMsg .Values.backend.secrets.JWT_SECRET_KEY | quote }}
  JWT_REFRESH_SECRET: {{ required $requiredMsg .Values.backend.secrets.JWT_REFRESH_SECRET | quote }}
  OPENAI_API_KEY: {{ required $requiredMsg .Values.backend.secrets.OPENAI_API_KEY | quote }}
  ANTHROPIC_API_KEY: {{ required $requiredMsg .Values.backend.secrets.ANTHROPIC_API_KEY | quote }}
  AZURE_OPENAI_API_KEY: {{ required $requiredMsg .Values.backend.secrets.AZURE_OPENAI_API_KEY | quote }}
  GOOGLE_API_KEY: {{ required $requiredMsg .Values.backend.secrets.GOOGLE_API_KEY | quote }}
  TAVILY_API_KEY: {{ required $requiredMsg .Values.backend.secrets.TAVILY_API_KEY | quote }}
  SENTRY_DSN: {{ .Values.backend.secrets.SENTRY_DSN | quote }}
