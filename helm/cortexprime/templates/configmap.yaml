apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cortexprime.fullname" . }}-config
  labels:
    {{- include "cortexprime.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment }}
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL }}
  CORS_ORIGINS: {{ .Values.backend.env.CORS_ORIGINS }}
  POSTGRES_HOST: {{ include "cortexprime.fullname" . }}-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: {{ .Values.postgresql.auth.username }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database }}
  REDIS_HOST: {{ include "cortexprime.fullname" . }}-redis-master
  REDIS_PORT: "6379"
  RABBITMQ_HOST: {{ include "cortexprime.fullname" . }}-rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | default "cortex" }}
  RABBITMQ_VHOST: {{ .Values.rabbitmq.auth.vhost | default "cortex" }}
  NEO4J_URI: bolt://{{ include "cortexprime.fullname" . }}-neo4j:7687
  NEO4J_USER: neo4j
  JWT_ALGORITHM: {{ .Values.backend.env.JWT_ALGORITHM | default "HS256" }}
  JWT_EXPIRE_MINUTES: {{ .Values.backend.env.JWT_EXPIRE_MINUTES | default "60" | quote }}
  JWT_REFRESH_EXPIRE_H: {{ .Values.backend.env.JWT_REFRESH_EXPIRE_H | default "168" | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.backend.env.RATE_LIMIT_ENABLED | default "false" | quote }}
  WS_AUTH_REQUIRED: {{ .Values.backend.env.WS_AUTH_REQUIRED | default "false" | quote }}
  AUTH_DISABLED: {{ .Values.backend.env.AUTH_DISABLED | default "false" | quote }}
  BLOCK_ON_MIGRATION_FAILURE: {{ .Values.backend.env.BLOCK_ON_MIGRATION_FAILURE | default "false" | quote }}
  STRICT_EMBEDDING_VALIDATION: {{ .Values.backend.env.STRICT_EMBEDDING_VALIDATION | default "false" | quote }}
