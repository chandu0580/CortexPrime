<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="CortexPrime — an autonomous DevOps operating platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#0E1A2B"/>
      <stop offset="100%" stop-color="#0A1F1A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38B88A" stop-opacity="0"/>
      <stop offset="18%" stop-color="#38B88A" stop-opacity=".9"/>
      <stop offset="82%" stop-color="#38B88A" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#38B88A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38B88A" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#38B88A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="148" cy="150" r="170" fill="url(#glow)"/>

  <!-- the product's own mark: outer shell, inner core -->
  <g transform="translate(96,102) scale(2.15)" fill="none" stroke="#38B88A" stroke-linejoin="round">
    <path d="M24 4.5 39 13v22L24 43.5 9 35V13L24 4.5Z" stroke-width="3.2"/>
    <path d="M24 13 31 17v14l-7 4-7-4V17l7-4Z" stroke-width="2.6" fill="#38B88A" fill-opacity=".18"/>
  </g>

  <text x="268" y="132" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#F3F7F5" letter-spacing="-1">CortexPrime</text>
  <text x="270" y="176" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#9FB3AC">An autonomous DevOps operating platform</text>
  <text x="270" y="210" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#38B88A">built so an AI can be trusted with production access</text>

  <rect x="270" y="238" width="740" height="2" fill="url(#rule)"/>

  <g font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7C918B">
    <text x="270" y="276">existence</text>
    <text x="378" y="276" fill="#38B88A">≠</text>
    <text x="402" y="276">trust</text>
    <text x="470" y="276" fill="#38B88A">≠</text>
    <text x="494" y="276">permission</text>
    <text x="616" y="276" fill="#38B88A">≠</text>
    <text x="640" y="276">selection</text>
    <text x="748" y="276" fill="#38B88A">≠</text>
    <text x="772" y="276">binding</text>
    <text x="864" y="276" fill="#38B88A">≠</text>
    <text x="888" y="276">execution</text>
  </g>
</svg>
