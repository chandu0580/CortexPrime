# Alembic migration environment configuration for CortexPrime.
# Run from the project root:
#   alembic -c backend/database/migrations/alembic.ini upgrade head

[alembic]
script_location = %(here)s
prepend_sys_path = .

# DSN is overridden in env.py from environment variables — this entry
# is only a fallback for local tooling without a .env file.
sqlalchemy.url = postgresql+asyncpg://cortex:cortexpass@localhost:5432/cortexdb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
