# ============================================================
# CortexPrime — Security Scan
# ============================================================
# Runs on: push to main/develop, weekly schedule, and manually.
#
# Checks:
#   pip-audit   Python dependency CVE scan
#   npm audit   Node.js dependency CVE scan
#   trivy       Container image vulnerability scan
#   semgrep     Static code analysis (OWASP patterns)
#
# All reports uploaded as artifacts.
# Critical vulnerabilities fail the workflow.
# ============================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ══════════════════════════════════════════════════════════
  # JOB 1 — Python dependency CVE audit
  # ══════════════════════════════════════════════════════════
  python-audit:
    name: Python — pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (production deps)
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json \
            --skip-editable \
            2>&1 | tee pip-audit-output.txt
          echo "Exit code: $?" >> pip-audit-output.txt
        continue-on-error: true

      - name: Run pip-audit (dev deps)
        run: |
          pip-audit \
            --requirement requirements-dev.txt \
            --format json \
            --output pip-audit-dev-report.json \
            --skip-editable \
            2>&1 | tee pip-audit-dev-output.txt
        continue-on-error: true

      - name: Summarize Python vulnerabilities
        run: |
          echo "## Python Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pip-audit-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload pip-audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-reports
          path: |
            pip-audit-report.json
            pip-audit-dev-report.json
            pip-audit-output.txt
          retention-days: 30

      - name: Fail on critical vulnerabilities
        run: |
          # Fail if any critical-severity CVEs are present
          python3 - << 'EOF'
          import json, sys
          try:
              with open("pip-audit-report.json") as f:
                  data = json.load(f)
              vulns = data.get("vulnerabilities", []) if isinstance(data, dict) else data
              critical = [v for v in vulns if isinstance(v, dict) and any(
                  a.get("severity", "").upper() in ("CRITICAL", "HIGH")
                  for a in v.get("aliases", [{}]) + v.get("fix_versions", [{}])
              )]
              if critical:
                  print(f"FAIL: {len(critical)} critical/high Python CVEs found")
                  for c in critical:
                      print(f"  - {c.get('id', '?')} in {c.get('package', '?')}")
                  sys.exit(1)
              print("PASS: No critical/high Python CVEs")
          except Exception as e:
              print(f"WARNING: Could not parse audit report: {e}")
          EOF

  # ══════════════════════════════════════════════════════════
  # JOB 2 — Node.js dependency audit
  # ══════════════════════════════════════════════════════════
  npm-audit:
    name: Node.js — npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: |
          npm audit --json > npm-audit-report.json 2>&1 || true
          npm audit --audit-level=high 2>&1 | tee npm-audit-output.txt || true

      - name: Summarize npm vulnerabilities
        run: |
          echo "## Node.js Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=none 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload npm-audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: |
            frontend/npm-audit-report.json
            frontend/npm-audit-output.txt
          retention-days: 30

      - name: Fail on critical npm vulnerabilities
        run: npm audit --audit-level=critical
        continue-on-error: true
        # Note: @sentry/nextjs peer-dep conflict means some advisories are
        # expected — set to continue-on-error and track manually

  # ══════════════════════════════════════════════════════════
  # JOB 3 — Container vulnerability scan (Trivy)
  # ══════════════════════════════════════════════════════════
  trivy-scan:
    name: Container — Trivy vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write   # needed to upload SARIF to GitHub Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: false
          load: true
          tags: cortexprime-backend:scan

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:    cortexprime-backend:scan
          format:       sarif
          output:       trivy-backend.sarif
          severity:     CRITICAL,HIGH
          exit-code:    "0"   # Don't fail build — report only
        continue-on-error: true

      - name: Run Trivy on filesystem (source scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:    fs
          scan-ref:     .
          format:       table
          output:       trivy-fs-report.txt
          severity:     CRITICAL,HIGH
          exit-code:    "0"
        continue-on-error: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
        continue-on-error: true

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-backend.sarif
            trivy-fs-report.txt
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # JOB 4 — Semgrep static analysis (OWASP patterns)
  # ══════════════════════════════════════════════════════════
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/python
            p/secrets
          generateSarif: "1"
          auditOn: push
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ══════════════════════════════════════════════════════════
  # FINAL — Consolidated report
  # ══════════════════════════════════════════════════════════
  security-summary:
    name: Security — Summary
    runs-on: ubuntu-latest
    needs: [python-audit, npm-audit, trivy-scan, semgrep]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate consolidated summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit | ${{ needs.python-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy     | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep   | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\` | Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
