---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortexprime-ingress
  namespace: cortexprime
  labels:
    app: cortexprime
    component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
    - hosts:
        - api.cortexprime.ai
        - app.cortexprime.ai
      secretName: cortexprime-tls
  rules:
    - host: api.cortexprime.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortexprime-backend
                port:
                  number: 8000
    - host: app.cortexprime.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortexprime-frontend
                port:
                  number: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cortexprime-chroma-pvc
  namespace: cortexprime
  labels:
    app: cortexprime
    component: chroma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortexprime-chroma-config
  namespace: cortexprime
  labels:
    app: cortexprime
    component: chroma
data:
  IS_PERSISTENT: "TRUE"