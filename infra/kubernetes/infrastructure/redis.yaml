---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cortexprime-redis
  namespace: cortexprime
  labels:
    app: cortexprime
    component: redis
spec:
  serviceName: cortexprime-redis
  replicas: 1
  selector:
    matchLabels:
      app: cortexprime
      component: redis
  template:
    metadata:
      labels:
        app: cortexprime
        component: redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --requirepass
            - "$(REDIS_PASSWORD)"
            - --appendonly
            - "yes"
            - --save
            - "300"
            - "10"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cortexprime-backend-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "--no-auth-warning", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "--no-auth-warning", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cortexprime-redis-master
  namespace: cortexprime
  labels:
    app: cortexprime
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: cortexprime
    component: redis