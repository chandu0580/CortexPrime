---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cortexprime-neo4j
  namespace: cortexprime
  labels:
    app: cortexprime
    component: neo4j
spec:
  serviceName: cortexprime-neo4j
  replicas: 1
  selector:
    matchLabels:
      app: cortexprime
      component: neo4j
  template:
    metadata:
      labels:
        app: cortexprime
        component: neo4j
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: neo4j
          image: neo4j:5.18-community
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_AUTH
              value: neo4j/$(NEO4J_PASSWORD)
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_dbms_memory_pagecache_size
              value: 256M
            - name: NEO4J_dbms_memory_heap_initial__size
              value: 256M
            - name: NEO4J_dbms_memory_heap_max__size
              value: 512M
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*"
          envFrom:
            - secretRef:
                name: cortexprime-backend-secret
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-logs
              mountPath: /logs
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: neo4j-logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cortexprime-neo4j
  namespace: cortexprime
  labels:
    app: cortexprime
    component: neo4j
spec:
  type: ClusterIP
  ports:
    - port: 7474
      targetPort: 7474
      name: http
    - port: 7687
      targetPort: 7687
      name: bolt
  selector:
    app: cortexprime
    component: neo4j