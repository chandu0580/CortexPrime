apiVersion: v1
kind: Namespace
metadata:
  name: cortexprime
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortexprime-backend-config
  namespace: cortexprime
  labels:
    app: cortexprime
    component: backend
data:
  ENVIRONMENT: production
  LOG_LEVEL: warning
  CORS_ORIGINS: https://app.cortexprime.ai
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: "60"
  JWT_REFRESH_EXPIRE_H: "168"
  POSTGRES_HOST: cortexprime-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: cortex
  POSTGRES_DB: cortexdb
  REDIS_HOST: cortexprime-redis-master
  REDIS_PORT: "6379"
  RABBITMQ_HOST: cortexprime-rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: cortex
  RABBITMQ_VHOST: cortex
  NEO4J_URI: bolt://cortexprime-neo4j:7687
  NEO4J_USER: neo4j
  CHROMA_PATH: /data/chroma
  BLOCK_ON_MIGRATION_FAILURE: "true"
  STRICT_EMBEDDING_VALIDATION: "true"
  STARTUP_EMBEDDING_VALIDATION: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: cortexprime-backend-secret
  namespace: cortexprime
  labels:
    app: cortexprime
    component: backend
type: Opaque
stringData:
    # Fill these from a secrets management tool or kubectl create secret
    # See ADMINISTRATOR_GUIDE.md for instructions
    POSTGRES_PASSWORD: ""        # required
    REDIS_PASSWORD: ""           # required
    RABBITMQ_PASSWORD: ""        # required
    NEO4J_PASSWORD: ""           # required
    JWT_SECRET_KEY: ""           # required
    JWT_REFRESH_SECRET: ""       # required
    OPENAI_API_KEY: ""           # optional (not needed for air-gapped)
    AZURE_OPENAI_API_KEY: ""     # optional
    ANTHROPIC_API_KEY: ""        # optional
    GOOGLE_API_KEY: ""           # optional
    TAVILY_API_KEY: ""           # optional
    SENTRY_DSN: ""               # optional
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexprime-backend
  namespace: cortexprime
  labels:
    app: cortexprime
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cortexprime
      component: backend
  template:
    metadata:
      labels:
        app: cortexprime
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 120
      serviceAccountName: cortexprime-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
          - name: backend
            image: ghcr.io/cortexprime/cortexprime-backend:1.0.0
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1001
              capabilities:
                drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cortexprime-backend-config
            - secretRef:
                name: cortexprime-backend-secret
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: cortexprime-database-url
                  key: url
                  optional: true
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@cortexprime-redis-master:6379/0
            - name: RABBITMQ_URL
              value: amqp://cortex:$(RABBITMQ_PASSWORD)@cortexprime-rabbitmq:5672/cortex
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cortexprime-backend-secret
                  key: NEO4J_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/system
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: chroma-data
              mountPath: /data/chroma
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: cortexprime-chroma-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cortexprime-backend
  namespace: cortexprime
  labels:
    app: cortexprime
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: cortexprime
    component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cortexprime-backend-hpa
  namespace: cortexprime
  labels:
    app: cortexprime
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cortexprime-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cortexprime-backend-pdb
  namespace: cortexprime
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cortexprime
      component: backend