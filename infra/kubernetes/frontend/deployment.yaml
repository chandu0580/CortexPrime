apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexprime-frontend
  namespace: cortexprime
  labels:
    app: cortexprime
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cortexprime
      component: frontend
  template:
    metadata:
      labels:
        app: cortexprime
        component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: ghcr.io/cortexprime/cortexprime-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: https://api.cortexprime.ai
            - name: NEXT_PUBLIC_WS_URL
              value: wss://api.cortexprime.ai/ws
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cortexprime-frontend
  namespace: cortexprime
  labels:
    app: cortexprime
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: cortexprime
    component: frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cortexprime-frontend-hpa
  namespace: cortexprime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cortexprime-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cortexprime-frontend-pdb
  namespace: cortexprime
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cortexprime
      component: frontend