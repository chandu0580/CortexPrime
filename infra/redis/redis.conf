# ==============================================================
# CORTEXPRIME — Redis Configuration
# Role: Realtime session store + cognition cache layer
#
# Mounted read-only at:
#   /usr/local/etc/redis/redis.conf
# Password is passed via --requirepass in docker-compose command
# ==============================================================

# --------------------------------------------------------------
# NETWORK
# --------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --------------------------------------------------------------
# MEMORY MANAGEMENT
# Configured as LRU cache with bounded memory
# --------------------------------------------------------------

# Maximum memory before eviction kicks in
# Adjust to container memory_limit × 0.8
maxmemory 256mb

# Eviction policy:
#   allkeys-lru   — evict any key using LRU (ideal for pure cache)
#   volatile-lru  — evict only keys with TTL set (mixed cache+session)
# Using volatile-lru so persistent session keys (no TTL) are never evicted
maxmemory-policy volatile-lru
maxmemory-samples 10

# --------------------------------------------------------------
# PERSISTENCE
# Both AOF (for session durability) and RDB (for snapshots)
# --------------------------------------------------------------

# Append-Only File — ensures session data survives restarts
appendonly yes
appendfilename "cortex.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# RDB Snapshots — point-in-time backups
save 900 1
save 300 10
save 60 1000

dbfilename cortex.rdb
dir /data

# --------------------------------------------------------------
# PERFORMANCE
# --------------------------------------------------------------
hz 10
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Reduce memory fragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10

# --------------------------------------------------------------
# SLOW LOG
# --------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 256

# --------------------------------------------------------------
# KEYSPACE NOTIFICATIONS (for pub/sub pattern on events)
# Enables: expired events + generic keyevent notifications
# Used by CortexPrime event bus for cache invalidation signals
# --------------------------------------------------------------
notify-keyspace-events "Ex"

# --------------------------------------------------------------
# CLIENTS
# --------------------------------------------------------------
maxclients 256
