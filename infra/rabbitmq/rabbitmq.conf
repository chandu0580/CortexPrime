## ==============================================================
## CORTEXPRIME — RabbitMQ Configuration
## Role: Async orchestration messaging bus for agent coordination
##
## Default user/vhost are created via RABBITMQ_DEFAULT_* env vars
## in docker-compose.yml — no user config needed here.
##
## Mounted read-only at: /etc/rabbitmq/rabbitmq.conf
## ==============================================================

## ------------------------------------------------------------
## NETWORKING
## ------------------------------------------------------------
listeners.tcp.default = 5672
management.tcp.port   = 15672

## Heartbeat: how often the broker checks if a client is alive (seconds)
heartbeat = 60

## Maximum connections per listener
connection_max = 1000

## ------------------------------------------------------------
## MEMORY & DISK THRESHOLDS
## RabbitMQ will start throttling publishers when memory/disk
## usage exceeds these thresholds to prevent crashes.
## ------------------------------------------------------------

## Block producers when memory exceeds 60% of total system memory
vm_memory_high_watermark.relative = 0.6

## Block producers when free disk space drops below 2 GB
disk_free_limit.absolute = 2GB

## ------------------------------------------------------------
## QUEUE DEFAULTS
## ------------------------------------------------------------

## Default message TTL for transient queues (30 minutes)
## Individual queues override this when declared
# default-message-ttl = 1800000

## ------------------------------------------------------------
## MANAGEMENT UI
## ------------------------------------------------------------
## Use RabbitMQ defaults for management sample retention.
## Custom retention keys can cause startup failures on some 3.13 builds.

## ------------------------------------------------------------
## LOGGING
## ------------------------------------------------------------
log.console       = true
log.console.level = info
log.file          = false

## ------------------------------------------------------------
## CLUSTER (single-node for now; extend for HA deployment)
## ------------------------------------------------------------
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
