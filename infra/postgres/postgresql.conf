# ==============================================================
# CORTEXPRIME — PostgreSQL Configuration
# Tuned for AI memory workloads: vector search, JSONB, write-heavy
#
# Mounted read-only into the container at:
#   /etc/postgresql/postgresql.conf
# ==============================================================

# --------------------------------------------------------------
# CONNECTION SETTINGS
# --------------------------------------------------------------
listen_addresses = '*'
max_connections  = 100

# --------------------------------------------------------------
# MEMORY — Tune to ~25% of available container RAM
# These defaults assume a 2 GB container allocation
# --------------------------------------------------------------
shared_buffers          = 512MB    # 25% of RAM
work_mem                = 64MB     # Per-sort / per-hash operation; high for vector queries
maintenance_work_mem    = 256MB    # VACUUM, CREATE INDEX — important for ivfflat builds
effective_cache_size    = 1536MB   # OS page cache estimate (75% of RAM)

# --------------------------------------------------------------
# WRITE PERFORMANCE — Optimised for event-heavy AI workloads
# --------------------------------------------------------------
wal_buffers                  = 16MB
checkpoint_completion_target = 0.9
min_wal_size                 = 512MB
max_wal_size                 = 2GB
wal_compression              = on

# --------------------------------------------------------------
# PARALLEL QUERY — Speeds up large vector scans
# --------------------------------------------------------------
max_parallel_workers_per_gather = 2
max_parallel_workers            = 4
max_parallel_maintenance_workers = 2

# --------------------------------------------------------------
# PLANNER SETTINGS
# --------------------------------------------------------------
effective_io_concurrency        = 200   # SSDs: 200; HDDs: 2
random_page_cost                = 1.1   # SSD-optimised (default 4.0 is for HDD)

# --------------------------------------------------------------
# LOGGING
# --------------------------------------------------------------
log_timezone           = 'UTC'
log_min_duration_statement = 1000    # Log queries slower than 1s
log_checkpoints        = on
log_connections        = off
log_disconnections     = off
log_line_prefix        = '%t [%p] %q%u@%d '

# --------------------------------------------------------------
# WAL ARCHIVING — OFF in the dev deployment (2026-08-13).
# The previous archive_command pointed at a directory that never
# existed (PGDATA is .../data/pgdata, the command wrote to
# .../data/pg_wal/archive), so every archive attempt failed
# (pg_stat_archiver: 780 failed / 0 archived) and Postgres retained
# every WAL segment ever written — 16 GB of pg_wal for 551 MB of
# databases. Archiving to a folder inside the SAME volume is not
# PITR anyway (it doubles WAL usage and dies with the volume).
# Re-enable only together with a real backup story: an off-volume
# archive target (S3/restic) and a tested restore procedure.
# --------------------------------------------------------------
wal_level           = replica
archive_mode        = off

# --------------------------------------------------------------
# MISC
# --------------------------------------------------------------
timezone           = 'UTC'
default_text_search_config = 'pg_catalog.english'
