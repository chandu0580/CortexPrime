# ==============================================================
# CORTEXPRIME — nginx global configuration
# Role: TLS termination · reverse proxy · security headers
# ==============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Maximum file descriptors per worker
worker_rlimit_nofile 65535;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------
    # Logging
    # ----------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # ----------------------------------------------------------
    # Performance
    # ----------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;   # hide nginx version

    # ----------------------------------------------------------
    # Buffer tuning
    # ----------------------------------------------------------
    client_body_buffer_size    16k;
    client_header_buffer_size  1k;
    client_max_body_size       32m;   # allow file/screenshot uploads
    large_client_header_buffers 4 8k;

    # ----------------------------------------------------------
    # Gzip compression
    # ----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ----------------------------------------------------------
    # TLS shared settings (referenced by server blocks)
    # ----------------------------------------------------------
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;
    ssl_stapling               on;
    ssl_stapling_verify        on;

    # ----------------------------------------------------------
    # DNS resolver — uses Docker's embedded DNS (127.0.0.11)
    # so upstream hostnames resolve at runtime, not just at startup.
    # ----------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ----------------------------------------------------------
    # Rate limiting zones
    # ----------------------------------------------------------
    # API: 30 requests/second per IP
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=30r/s;
    # Auth: 5 requests/second per IP (brute-force protection)
    limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=5r/s;
    # WebSocket: 5 new connections/second per IP
    limit_conn_zone $binary_remote_addr  zone=ws_conn:10m;

    # ----------------------------------------------------------
    # Upstream definitions
    # ----------------------------------------------------------
    upstream cortex_backend {
        zone cortex_backend 64k;
        server cortex-backend:8000 resolve;
        keepalive 32;
    }

    upstream cortex_frontend {
        zone cortex_frontend 64k;
        server cortex-frontend:3000 resolve;
        keepalive 16;
    }

    # ----------------------------------------------------------
    # Virtual host configs
    # ----------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
