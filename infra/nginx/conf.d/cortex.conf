# ==============================================================
# CORTEXPRIME — nginx virtual-host: cortex.conf
#
# Handles:
#   ① HTTP → HTTPS redirect (port 80)
#   ② HTTPS termination (port 443)
#      - /api/*         → FastAPI backend
#      - /ws            → FastAPI WebSocket
#      - /health*       → FastAPI health endpoints (no auth passthrough)
#      - /docs /openapi → FastAPI Swagger (internal only — remove in prod)
#      - everything else → Next.js frontend
#
# Cert paths match docker-compose volume mount:
#   /etc/nginx/certs/cert.pem
#   /etc/nginx/certs/key.pem
# Use generate-certs.sh for self-signed or mount Let's Encrypt certs.
# ==============================================================

# ── ① HTTP → HTTPS redirect ────────────────────────────────────────────────

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # ACME challenge passthrough (Let's Encrypt certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck endpoint — responds 200 on HTTP without redirect so Docker
    # healthcheck (wget http://127.0.0.1/health) always succeeds when nginx is up.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ── ② HTTPS main server ────────────────────────────────────────────────────

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    # ----------------------------------------------------------
    # TLS certificates
    # ----------------------------------------------------------
    ssl_certificate      /etc/nginx/certs/cert.pem;
    ssl_certificate_key  /etc/nginx/certs/key.pem;

    # ----------------------------------------------------------
    # Security headers — applied to every response
    # ----------------------------------------------------------

    # HSTS: 1 year, include subdomains, submit to preload list
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent page being framed by other origins (clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — disable unused browser APIs
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

    # Hide upstream technology details
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ----------------------------------------------------------
    # Shared proxy settings
    # ----------------------------------------------------------
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_read_timeout      120s;
    proxy_send_timeout      120s;
    proxy_connect_timeout   10s;
    proxy_buffer_size       16k;
    proxy_buffers           4 32k;
    proxy_busy_buffers_size 64k;

    # ----------------------------------------------------------
    # WebSocket endpoint — /ws
    # ----------------------------------------------------------
    location = /ws {
        limit_conn  ws_conn 10;   # max 10 concurrent WS connections per IP

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

        proxy_pass          http://cortex_backend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;   # keep WS alive for up to 1 hour
        proxy_send_timeout  3600s;
    }

    # ----------------------------------------------------------
    # Backend API — /api/*
    # ----------------------------------------------------------
    location /api/ {
        limit_req  zone=api  burst=60  nodelay;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

        proxy_pass  http://cortex_backend;
    }

    # ----------------------------------------------------------
    # Auth endpoints — stricter rate limiting
    # ----------------------------------------------------------
    location /api/auth/ {
        limit_req  zone=auth  burst=10  nodelay;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

        proxy_pass  http://cortex_backend;
    }

    # ----------------------------------------------------------
    # Prometheus metrics scrape endpoint — backend only
    # ----------------------------------------------------------
    location = /metrics {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

        proxy_pass  http://cortex_backend;
        access_log  off;
    }

    # ----------------------------------------------------------
    # Health endpoints — no rate limiting (monitoring probes)
    # ----------------------------------------------------------
    location /health {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

        proxy_pass  http://cortex_backend;
        access_log  off;
    }

    # ----------------------------------------------------------
    # Swagger UI — REMOVE or restrict to internal IPs in prod
    # ----------------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json) {
        # Uncomment to restrict to internal networks:
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # deny all;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

        proxy_pass  http://cortex_backend;
    }

    # ----------------------------------------------------------
    # Computer Agent + Operator — additional rate limiting
    # ----------------------------------------------------------
    # Execute / orchestrate / events / runtime-state — additional backend endpoints
    # not under /api/ (for backwards compatibility with existing clients)
    location ~ ^/(execute|orchestrate|events|runtime-state) {
        limit_req  zone=api  burst=60  nodelay;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

        proxy_pass  http://cortex_backend;
    }

    location ~ ^/(computer|operator)/ {
        limit_req  zone=api  burst=10  nodelay;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

        proxy_pass  http://cortex_backend;
    }

    # ----------------------------------------------------------
    # Frontend — everything else → Next.js
    # ----------------------------------------------------------
    location / {
        proxy_pass  http://cortex_frontend;

        # Next.js static assets — aggressive caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass   http://cortex_frontend;
            expires      1y;
            add_header   Cache-Control "public, immutable";
        }
    }

    # ----------------------------------------------------------
    # Next.js HMR WebSocket (dev only — disabled here)
    # ----------------------------------------------------------
    location /_next/webpack-hmr {
        return 404;
    }
}
