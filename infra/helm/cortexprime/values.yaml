# ==============================================================
# CortexPrime Helm Values
# ==============================================================
# Override per environment:
#   helm install cortexprime ./cortexprime -f values.yaml
#   helm install cortexprime ./cortexprime -f values-staging.yaml
# ==============================================================

global:
  environment: production
  imageRegistry: ghcr.io/cortexprime
  imagePullPolicy: Always
  dnsDomain: cortexprime.ai

# --------------------------------------------------------------
# Backend configuration
# --------------------------------------------------------------
backend:
  enabled: true
  replicas: 2
  minReplicas: 2
  maxReplicas: 10
  image:
    repository: cortexprime-backend
    tag: latest
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 60
      periodSeconds: 30
    readiness:
      path: /health/system
      initialDelaySeconds: 30
      periodSeconds: 15
    startup:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 30
  autoscaling:
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  env:
    ENVIRONMENT: production
    LOG_LEVEL: warning
    JWT_EXPIRE_MINUTES: "60"
    JWT_REFRESH_EXPIRE_H: "168"
    BLOCK_ON_MIGRATION_FAILURE: "true"
    STRICT_EMBEDDING_VALIDATION: "true"

# --------------------------------------------------------------
# Frontend configuration
# --------------------------------------------------------------
frontend:
  enabled: true
  replicas: 2
  minReplicas: 2
  maxReplicas: 6
  image:
    repository: cortexprime-frontend
    tag: latest
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env:
    NEXT_PUBLIC_API_URL: https://api.cortexprime.ai
    NEXT_PUBLIC_WS_URL: wss://api.cortexprime.ai/ws

# --------------------------------------------------------------
# PostgreSQL configuration
# --------------------------------------------------------------
postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  storageSize: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

# --------------------------------------------------------------
# Redis configuration
# --------------------------------------------------------------
redis:
  enabled: true
  image: redis:7.2-alpine
  storageSize: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --------------------------------------------------------------
# RabbitMQ configuration
# --------------------------------------------------------------
rabbitmq:
  enabled: true
  image: rabbitmq:3.13-management-alpine
  storageSize: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --------------------------------------------------------------
# Neo4j configuration
# --------------------------------------------------------------
neo4j:
  enabled: true
  image: neo4j:5.18-community
  storageSize: 20Gi
  logStorageSize: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# --------------------------------------------------------------
# Ingress configuration
# --------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  backendHost: api.cortexprime.ai
  frontendHost: app.cortexprime.ai
  tlsSecretName: cortexprime-tls

# --------------------------------------------------------------
# Prometheus monitoring
# --------------------------------------------------------------
monitoring:
  enabled: true
  prometheusAnnotations: true
  serviceMonitor:
    enabled: false

# --------------------------------------------------------------
# Chroma data storage
# --------------------------------------------------------------
chroma:
  storageSize: 10Gi