apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: "{{ .Values.secrets.postgresPassword }}"
  REDIS_PASSWORD: "{{ .Values.secrets.redisPassword }}"
  RABBITMQ_PASSWORD: "{{ .Values.secrets.rabbitmqPassword }}"
  NEO4J_PASSWORD: "{{ .Values.secrets.neo4jPassword }}"
  JWT_SECRET_KEY: "{{ .Values.secrets.jwtSecretKey }}"
  JWT_REFRESH_SECRET: "{{ .Values.secrets.jwtRefreshSecret }}"
  OPENAI_API_KEY: "{{ .Values.secrets.openaiApiKey }}"
  AZURE_OPENAI_API_KEY: "{{ .Values.secrets.azureOpenaiApiKey }}"
  ANTHROPIC_API_KEY: "{{ .Values.secrets.anthropicApiKey }}"
  GOOGLE_API_KEY: "{{ .Values.secrets.googleApiKey }}"
  TAVILY_API_KEY: "{{ .Values.secrets.tavilyApiKey }}"
  SENTRY_DSN: "{{ .Values.secrets.sentryDsn }}"