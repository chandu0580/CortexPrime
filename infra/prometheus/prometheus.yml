# ==============================================================
# CORTEXPRIME — Prometheus scrape configuration
# ==============================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project: "cortexprime"
    environment: "production"

# Alerting (wire up Alertmanager here when needed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # ── CortexPrime Backend ────────────────────────────────────────────────────
  - job_name: "cortex-backend"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["cortex-backend:8000"]
        labels:
          service: "backend"
          component: "fastapi"

  # ── Prometheus self-scrape ─────────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Redis exporter (optional — add redis_exporter container to enable) ──────
  # - job_name: "cortex-redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # ── PostgreSQL exporter (optional) ──────────────────────────────────────────
  # - job_name: "cortex-postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # ── RabbitMQ exporter (optional) ────────────────────────────────────────────
  # - job_name: "cortex-rabbitmq"
  #   static_configs:
  #     - targets: ["cortex-rabbitmq:15692"]   # management plugin /metrics
