# ==============================================================
# CORTEXPRIME — Docker Compose (Development)
# Realtime Autonomous AI Operating System Infrastructure
#
# Services:
#   cortex-backend    FastAPI cognitive runtime        :8000
#   cortex-frontend   Next.js cinematic UI             :3000
#   cortex-postgres   PostgreSQL + pgvector            :5432
#   cortex-redis      Session store + cognition cache  :6379
#   cortex-rabbitmq   Async orchestration bus          :5672 / :15672
#   cortex-neo4j      Cognitive graph engine           :7474 / :7687
#   cortex-prometheus Prometheus metrics scraper       :9090
#   cortex-grafana    Grafana dashboards               :3001
#
# Usage:
#   docker compose up            (development with hot-reload)
#   docker compose up -d         (detached)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================

name: cortexprime

# ==============================================================
# NETWORKS — Isolated service planes
# ==============================================================

networks:
  # Application plane: nginx <-> frontend <-> backend
  cortex-app:
    name: cortex-app
    driver: bridge

  # Data plane: backend <-> all data services (isolated from frontend + nginx)
  cortex-data:
    name: cortex-data
    driver: bridge

# ==============================================================
# VOLUMES — Persistent cognitive state
# ==============================================================

volumes:
  cortex-postgres-data:
    name: cortex-postgres-data
  cortex-redis-data:
    name: cortex-redis-data
  cortex-rabbitmq-data:
    name: cortex-rabbitmq-data
  cortex-neo4j-data:
    name: cortex-neo4j-data
  cortex-neo4j-logs:
    name: cortex-neo4j-logs
  cortex-neo4j-import:
    name: cortex-neo4j-import
  cortex-chroma-data:
    name: cortex-chroma-data
  cortex-nginx-certs:
    name: cortex-nginx-certs
  cortex-prometheus-data:
    name: cortex-prometheus-data
  cortex-grafana-data:
    name: cortex-grafana-data
  cortex-minio-data:
    name: cortex-minio-data
  cortex-opensearch-data:
    name: cortex-opensearch-data
  cortex-vault-data:
    name: cortex-vault-data

# ==============================================================
# SERVICES
# ==============================================================

services:

  # ------------------------------------------------------------
  # BACKEND — FastAPI Cognitive Runtime
  # ------------------------------------------------------------
  cortex-backend:
    container_name: cortex-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Auth + JWT
      CORTEX_USER: ${CORTEX_USER:-admin}
      CORTEX_PASSWORD: ${CORTEX_PASSWORD:-}
      CORTEX_PASSWORD_HASH: ${CORTEX_PASSWORD_HASH:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      JWT_REFRESH_EXPIRE_H: ${JWT_REFRESH_EXPIRE_H:-168}
      # LLM providers
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-01-01-preview}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # External integrations
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_RATE: ${SENTRY_TRACES_RATE:-0.1}
      SENTRY_PROFILES_RATE: ${SENTRY_PROFILES_RATE:-0.1}
      # Voice V2
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      MODEL_TTS: ${MODEL_TTS:-gpt-4o-mini-tts}
      # PostgreSQL
      POSTGRES_HOST: cortex-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cortexdb}
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@cortex-postgres:5432/${POSTGRES_DB:-cortexdb}
      # Redis
      REDIS_HOST: cortex-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cortex-redis:6379/0
      # RabbitMQ
      RABBITMQ_HOST: cortex-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-cortex}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-cortex}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cortex}:${RABBITMQ_PASSWORD}@cortex-rabbitmq:5672/${RABBITMQ_VHOST:-cortex}
      # Neo4j
      NEO4J_URI: bolt://cortex-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # MinIO / S3 Object Storage
      MINIO_ENDPOINT: cortex-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-cortex}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: "false"
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET:-cortex-artifacts}
      S3_LOGS_BUCKET: ${S3_LOGS_BUCKET:-cortex-logs}
      S3_BACKUPS_BUCKET: ${S3_BACKUPS_BUCKET:-cortex-backups}
      # OpenSearch
      OPENSEARCH_HOST: cortex-opensearch
      OPENSEARCH_REST_PORT: 9200
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_VERIFY_CERTS: "false"
      # Vault
      VAULT_ADDR: http://cortex-vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-cortex-dev-token}
      # ChromaDB
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - .:/workspace:cached                      # Hot-reload: full project mounted
      - cortex-chroma-data:/data/chroma          # Persistent vector store
      - ./generated_voice:/workspace/generated_voice
      - ./generated_screens:/workspace/generated_screens
    working_dir: /workspace
    # The container ENTRYPOINT (backend/entrypoint.sh) runs alembic upgrade head
    # first, then execs the CMD below.  Migrations happen automatically before
    # every uvicorn start — no manual steps required.
    command:
      - "uvicorn"
      - "backend.main:app"
      - "--reload"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--log-level"
      - "${LOG_LEVEL:-info}"
    depends_on:
      cortex-postgres:
        condition: service_healthy
      cortex-redis:
        condition: service_healthy
      cortex-rabbitmq:
        condition: service_healthy
      cortex-neo4j:
        condition: service_healthy
    networks:
      - cortex-app
      - cortex-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # FRONTEND — Next.js Cinematic UI
  # ------------------------------------------------------------
  cortex-frontend:
    container_name: cortex-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      WATCHPACK_POLLING: "true"    # Ensures FS events work inside Docker
    volumes:
      - ./frontend:/app:cached    # Hot-reload: source mounted
      - /app/node_modules         # Container's node_modules preserved
      - /app/.next                # Next.js build cache preserved
    working_dir: /app
    command: npm run dev
    depends_on:
      cortex-backend:
        condition: service_healthy
    networks:
      - cortex-app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ------------------------------------------------------------
  # POSTGRES + pgvector — AI Memory Store
  # ------------------------------------------------------------
  cortex-postgres:
    container_name: cortex-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cortexdb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - cortex-postgres-data:/var/lib/postgresql/data
      # init.sql is NOT mounted. Alembic owns the application schema (ADR-109).
      # It used to run here on first volume init and create 8 tables -- 6 of them
      # duplicates of migration 0001 in a DIFFERENT shape -- after which
      # `alembic upgrade head` died on 0001 with DuplicateTableError and this
      # stack could not start from a fresh volume. postgresql.conf below is a
      # separate file and IS still required: `command:` names it as config_file.
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortexdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------
  # REDIS — Realtime Session Store + Cognition Cache
  # ------------------------------------------------------------
  cortex-redis:
    container_name: cortex-redis
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server /usr/local/etc/redis/redis.conf
        --requirepass ${REDIS_PASSWORD}
    volumes:
      - cortex-redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------
  # RABBITMQ — Async Orchestration Messaging Bus
  # ------------------------------------------------------------
  cortex-rabbitmq:
    container_name: cortex-rabbitmq
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cortex}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-cortex}
    volumes:
      - cortex-rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------
  # NEO4J — Cognitive Graph Relationship Engine
  # ------------------------------------------------------------
  cortex-neo4j:
    container_name: cortex-neo4j
    image: neo4j:5.18-community
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGE_CACHE:-256M}
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP_INIT:-256M}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512M}
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - cortex-neo4j-data:/data
      - cortex-neo4j-logs:/logs
      - cortex-neo4j-import:/import
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ------------------------------------------------------------
  # PROMETHEUS — Metrics scraper
  # ------------------------------------------------------------
  cortex-prometheus:
    container_name: cortex-prometheus
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cortex-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - cortex-data
      - cortex-app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ------------------------------------------------------------
  # GRAFANA — Dashboards (auto-provisioned)
  # ------------------------------------------------------------
  cortex-grafana:
    container_name: cortex-grafana
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - cortex-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      cortex-prometheus:
        condition: service_healthy
    networks:
      - cortex-app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------
  # MINIO — Object Storage (S3-compatible)
  # Stores execution artifacts, logs, screenshots, backups, and
  # any binary data that does not belong in PostgreSQL.
  # ------------------------------------------------------------
  cortex-minio:
    container_name: cortex-minio
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-cortex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE:        ${MINIO_SECURE:-true}
      MINIO_DOMAIN:        ${MINIO_DOMAIN:-s3.cortexprime.internal}
      MINIO_REGION:        ${MINIO_REGION:-us-east-1}
    volumes:
      - cortex-minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------
  # OPENSEARCH — Logs, traces, and full-text search engine
  # Provides centralized log aggregation, trace storage, and
  # search capabilities for the Observability bounded context.
  # ------------------------------------------------------------
  cortex-opensearch:
    container_name: cortex-opensearch
    image: opensearchproject/opensearch:2.14.0
    restart: unless-stopped
    ports:
      - "${OPENSEARCH_REST_PORT:-9200}:9200"
      - "${OPENSEARCH_PERF_PORT:-9600}:9600"
    environment:
      discovery.type:             single-node
      DISABLE_SECURITY_PLUGIN:   ${OPENSEARCH_SECURITY_DISABLED:-false}
      plugins.security.disabled: ${OPENSEARCH_SECURITY_DISABLED:-false}
      OPENSEARCH_JAVA_OPTS:      ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      DISABLE_INSTALL_DEMO_CONFIG: true
    volumes:
      - cortex-opensearch-data:/usr/share/opensearch/data
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ------------------------------------------------------------
  # VAULT — Secrets Management
  # Securely stores API keys, database credentials, and TLS
  # certificates. Run in dev mode for local development;
  # use HA mode with auto-unseal in production.
  # ------------------------------------------------------------
  cortex-vault:
    container_name: cortex-vault
    image: hashicorp/vault:1.17.6
    restart: unless-stopped
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      # PRODUCTION: Remove -dev flags and configure proper unseal + TLS.
      # See docs/OPERATIONS_RUNBOOK.md for production Vault setup.
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - cortex-vault-data:/vault/data
    command: server -dev -dev-listen-address=0.0.0.0:8200
    networks:
      - cortex-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8200/v1/sys/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
